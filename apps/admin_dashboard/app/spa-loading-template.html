<style>
  .loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #ffffff;
  }

  .loader__spinner {
    width: 50px;
    padding: 8px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #3b82f6;
    --_m:
      conic-gradient(#0000 10%, #000),
      linear-gradient(#000 0 0) content-box;
    -webkit-mask: var(--_m);
            mask: var(--_m);
    -webkit-mask-composite: source-out;
            mask-composite: subtract;
    animation: loader-spin 1s infinite linear;
  }

  .loader__text {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    color: #6b7280;
  }

  html.dark .loader {
    background: #1b1718;
  }

  html.dark .loader__text {
    color: #9ca3af;
  }

  @keyframes loader-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>

<div class="loader">
  <div class="loader__spinner"></div>
  <span class="loader__text">Đang tải...</span>
</div>
