<style>
  .loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #ffffff;
  }

  .loader__spinner {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid #e5e7eb;
    border-top-color: #3b82f6;
    animation: loader-spin 700ms linear infinite;
  }

  .loader__text {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    color: #6b7280;
  }

  html.dark .loader {
    background: #1b1718;
  }

  html.dark .loader__spinner {
    border-color: #3f3f46;
    border-top-color: #3b82f6;
  }

  html.dark .loader__text {
    color: #9ca3af;
  }

  @keyframes loader-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>

<div class="loader">
  <div class="loader__spinner"></div>
  <span class="loader__text">Loading…</span>
</div>
