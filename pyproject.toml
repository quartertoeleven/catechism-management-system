[project]
name = "catechism-management-system"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "dishka>=1.10.1",
    "python-cqrs[dishka]>=5.6.0",
]

[tool.uv.workspace]
members = [
    "apps/admin_dashboard_api",
    "apps/cli",
    "libs/application",
    "libs/infrastructure",
    "libs/domain",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "admin-dashboard-api",
    "cms-cli",
]

[tool.uv.sources]
admin-dashboard-api = { workspace = true }
cms-cli = { workspace = true }
